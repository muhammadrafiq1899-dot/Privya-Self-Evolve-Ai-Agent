version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - agent-data:/root/.ai-agent
      - ./.env:/app/.env:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agent-data:
